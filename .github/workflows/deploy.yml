name: Deploy Next.js (estático) a EC2 + S3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build con assetPrefix hacia S3
        run: npm run build
        env:
          ASSET_PREFIX: https://${{ secrets.S3_BUCKET }}.s3.us-east-1.amazonaws.com

      - name: Configurar credenciales de AWS (limpia espacios y saltos de línea)
        env:
          RAW_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAW_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed 's/^aws_[a-z_]*=//'; }
          KEY=$(clean "$RAW_KEY")
          SECRET=$(clean "$RAW_SECRET")
          TOKEN=$(clean "$RAW_TOKEN")
          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"
          echo "Longitudes -> key: ${#KEY} (esperado 20), secret: ${#SECRET} (esperado 40), token: ${#TOKEN}"
          echo "AWS_ACCESS_KEY_ID=$KEY" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"
          AWS_ACCESS_KEY_ID="$KEY" AWS_SECRET_ACCESS_KEY="$SECRET" AWS_SESSION_TOKEN="$TOKEN" AWS_DEFAULT_REGION=us-east-1 aws sts get-caller-identity > /dev/null && echo "Credenciales válidas"

      - name: Subir estáticos (_next) a S3
        run: |
          aws s3 sync ./out/_next s3://${{ secrets.S3_BUCKET }}/_next \
            --cache-control "public,max-age=31536000,immutable"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar HTML y el resto a EC2 (sin _next)
        run: |
          rsync -avz --delete --exclude '_next/' -e "ssh -i ~/.ssh/key.pem" \
            ./out/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/